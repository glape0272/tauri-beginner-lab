<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri Beginner Lab</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="workspace-header" id="workspace-header">
          <div>
            <p class="eyebrow">Tauri Beginner Lab</p>
            <h1>完全初心者から始めるTauri入門</h1>
          </div>
          <div class="status-panel" aria-live="polite">
            <span class="status-label">Rust command</span>
            <strong id="command-status">待機中</strong>
          </div>
        </header>

        <section class="home-layout" id="home-view">
          <article class="tool-panel route-panel">
            <h2>学習ステップと読み飛ばし</h2>
            <p>ステップを選ぶと、VSCodeで編集するファイルと内容を確認できます。</p>
            <div class="lesson-list" id="lesson-list"></div>
          </article>

          <article class="tool-panel">
            <h2>Rustから受け取った情報</h2>
            <dl class="info-list" id="app-info">
              <div>
                <dt>アプリ名</dt>
                <dd>読み込み中</dd>
              </div>
            </dl>
          </article>
        </section>

        <section class="code-workspace" id="code-view" hidden>
          <div class="code-toolbar">
            <button class="secondary-button" type="button" id="back-button">戻る</button>
            <div>
              <p class="eyebrow">Code workspace</p>
              <h2 id="workspace-title">学習ステップ</h2>
            </div>
          </div>

          <div class="workspace-grid">
            <article class="tool-panel task-panel">
              <h3>この画面で行う処理</h3>
              <p id="workspace-description"></p>
              <ul class="task-list" id="workspace-tasks"></ul>
              <div class="step-actions" id="workspace-actions"></div>
            </article>

            <article class="tool-panel editor-panel">
              <label for="code-editor">VSCodeで編集する内容</label>
              <textarea id="code-editor" spellcheck="false"></textarea>
              <output id="workspace-output">ステップを選ぶと、ここに補足が表示されます。</output>
            </article>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
