<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri Beginner Lab</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Tauri Beginner Lab</p>
            <h1>完全初心者から始めるTauri入門</h1>
          </div>
          <div class="status-panel" aria-live="polite">
            <span class="status-label">Rust command</span>
            <strong id="command-status">待機中</strong>
          </div>
        </header>

        <section class="command-grid" aria-label="Rust command playground">
          <form class="tool-panel" id="greet-form">
            <div>
              <h2>01. Rustに文字列を渡す</h2>
              <p>名前をTypeScriptからRustへ送り、Rustが作った文章を受け取ります。</p>
            </div>
            <label for="greet-input">名前</label>
            <div class="inline-control">
              <input id="greet-input" name="name" placeholder="例: Aki" autocomplete="off" />
              <button type="submit">実行</button>
            </div>
            <output id="greet-output">まだ実行していません。</output>
          </form>

          <form class="tool-panel" id="progress-form">
            <div>
              <h2>02. Rustで計算し、Resultで返す</h2>
              <p>完了数と合計数をRustへ渡し、進捗率かエラーを受け取ります。</p>
            </div>
            <div class="field-row">
              <label>
                完了
                <input id="done-input" name="done" type="number" min="0" value="1" />
              </label>
              <label>
                合計
                <input id="total-input" name="total" type="number" min="0" value="6" />
              </label>
            </div>
            <button type="submit">計算</button>
            <output id="progress-output">まだ計算していません。</output>
          </form>
        </section>

        <section class="info-layout">
          <article class="tool-panel">
            <h2>Rustから受け取った情報</h2>
            <dl class="info-list" id="app-info">
              <div>
                <dt>アプリ名</dt>
                <dd>読み込み中</dd>
              </div>
            </dl>
          </article>

          <article class="tool-panel">
            <h2>学習ステップと読み飛ばし</h2>
            <ol class="lesson-list" id="lesson-list"></ol>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
